services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: canopy
      POSTGRES_DB: canopy
    ports:
      # Host 5432 is taken by a local Postgres; expose Canopy's PostGIS on 5433.
      - "5433:5432"
    volumes:
      - canopy_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canopy_pgdata:
